name: Omni CI

# DAG:
#   preflight -> setup -> pr-test -> tts-ci
#                  |                   |
#                  +-- pick-tts-model -+
#   setup + unit/model suites -> cleanup (dispatch only)
#
# Benchmark suites wait for the previous suite to finish but use always() so a
# failed unit/benchmark suite does not skip later suites. Only setup blocks all
# downstream model CI.
#
# PR-scoped homes (/data/omni-ci/pr-<N>) persist on the runner for reuse across
# pushes (runner TTL, e.g. 3 days). reconcile_omni_ci_env.sh validates fingerprint,
# pins, and imports before reuse; otherwise rebuilds OMNI_CI_HOME.
# cleanup-pr-ci-home-on-close.yaml removes the home when the PR closes.
#
# OMNI_CI_HOME must live under /data/omni-ci (a persistent host bind mount), NOT
# under /github/home: the runner's TempDirectoryManager wipes /github/home
# (= _work/_temp/_github_home, its RUNNER_TEMP) at every job boundary, which would
# delete the prepared venv between jobs and force every stage to rebuild.


on:
  pull_request:
    branches: [main]
    types: [opened, labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      tts_ci_model:
        description: "Optional TTS CI model preset to run (voicing-tts or voicing-tts-custom-voice). Leave empty for the default rotation."
        required: false
        type: string
        default: ""

concurrency:
  group: omni-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  OMNI_CI_HOME: >-
    ${{ github.event_name == 'pull_request'
        && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
        || format('/data/omni-ci/run-{0}', github.run_id) }}
  # Voicing-TTS loads converted checkpoints; setup converts these sources once
  # into the persistent /data/omni-ci mount and reuses them afterwards.
  VOICING_TTS_SOURCE_MODEL: Qwen/Qwen3-TTS-12Hz-1.7B-Base
  VOICING_TTS_CUSTOM_VOICE_SOURCE_MODEL: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
  VOICING_TTS_MODEL_PATH: /data/omni-ci/checkpoints/voicing-tts-12hz-1.7b-base
  VOICING_TTS_CUSTOM_VOICE_MODEL_PATH: /data/omni-ci/checkpoints/voicing-tts-12hz-1.7b-customvoice


jobs:
  preflight:
    name: omni-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      labels: ${{ steps.pr.outputs.labels || '[]' }}
    steps:
      - name: Fetch latest PR gate state
        if: ${{ github.event_name == 'pull_request' }}
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            // Reruns reuse the original pull_request event payload, so fetch
            // live labels/draft state after /tag-and-rerun-ci adds run-ci.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput("labels", JSON.stringify(pr.data.labels.map((label) => label.name)));
            core.setOutput("draft", pr.data.draft ? "true" : "false");

      - name: Log PR gate state
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "PR labels: ${{ steps.pr.outputs.labels }}"
          echo "PR draft: ${{ steps.pr.outputs.draft }}"

      - name: Block draft PR
        if: ${{ github.event_name == 'pull_request' && fromJson(steps.pr.outputs.draft) }}
        run: |
          echo "PR is draft. Blocking Omni CI."
          exit 1

      - name: Require run-ci label
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ "${{ contains(fromJson(steps.pr.outputs.labels), 'run-ci') }}" == "false" ]]; then
            echo "Missing required label 'run-ci'. Add the label or use /tag-and-rerun-ci to opt into Omni CI."
            exit 1
          fi

      - name: Checkout workflow scripts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout workflow scripts for manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - name: Check PR lint and mergeability
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr_ci_gate.py

      - name: Manual dispatch preflight
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Manual workflow_dispatch bypasses PR lint/mergeability gate."

  setup:
    name: setup - omni venv
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: [self-hosted, h100]
    timeout-minutes: 30
    container:
      image: hongccc/sglang-omni@sha256:ebe4239e29a764ee3a2806385c061c5fd438a26f01458e503d3822dcba5790df
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assess CI environment completeness
        id: env_state
        shell: bash
        run: |
          echo "OMNI_CI_HOME=${OMNI_CI_HOME}"
          if bash .github/scripts/validate_omni_env_reusable.sh omni; then
            echo "action=reuse" >> "${GITHUB_OUTPUT}"
            echo "Existing environment passes reuse gate; will refresh editable install."
          else
            echo "action=rebuild" >> "${GITHUB_OUTPUT}"
            echo "Environment missing or drifted; will reconcile or rebuild."
          fi

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni
          install-deps: "true"

      - name: Build Rust router
        shell: bash
        run: |
          binary="$(bash .github/scripts/prepare_rust_router.sh build)"
          echo "SGLANG_OMNI_ROUTER_BIN=${binary}" >> "${GITHUB_ENV}"

      - uses: ./.github/actions/omni-save-cache
        with:
          venv-name: omni

      - name: Ensure CI model weights
        shell: bash
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash .github/scripts/ensure_hf_models.sh omni \
            "${VOICING_TTS_SOURCE_MODEL}" \
            "${VOICING_TTS_CUSTOM_VOICE_SOURCE_MODEL}"

      - name: Convert Voicing-TTS checkpoints
        shell: bash
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          source omni/bin/activate
          for pair in \
            "${VOICING_TTS_SOURCE_MODEL}=${VOICING_TTS_MODEL_PATH}" \
            "${VOICING_TTS_CUSTOM_VOICE_SOURCE_MODEL}=${VOICING_TTS_CUSTOM_VOICE_MODEL_PATH}"; do
            source_model="${pair%%=*}"
            target_dir="${pair#*=}"
            if [[ -f "${target_dir}/config.json" ]]; then
              echo "Reusing converted checkpoint ${target_dir}"
            else
              # Convert into a staging dir so an interrupted run never leaves a
              # half-converted checkpoint that a later run would reuse.
              staging_dir="${target_dir}.tmp-${GITHUB_RUN_ID}"
              rm -rf "${staging_dir}"
              mkdir -p "$(dirname "${target_dir}")"
              python -m sglang_omni.models.voicing_tts.convert_checkpoint \
                "${source_model}" "${staging_dir}"
              mv "${staging_dir}" "${target_dir}"
            fi
          done

      - name: Mark PR environment complete
        shell: bash
        run: bash .github/scripts/mark_omni_env_complete.sh omni

      - name: Verify setup completion marker
        shell: bash
        run: bash .github/scripts/validate_omni_env_complete.sh omni

  pick-tts-model:
    name: pick TTS model
    needs: [preflight, setup]
    runs-on: ubuntu-latest
    outputs:
      selected_model: ${{ steps.tts.outputs.selected_model }}
      selection_digest: ${{ steps.tts.outputs.selection_digest }}
    steps:
      - name: Checkout workflow scripts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout workflow scripts for manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - name: Select TTS model once
        id: tts
        shell: bash
        env:
          RUN_VOICING_TTS_LABEL: ${{ contains(fromJson(needs.preflight.outputs.labels || '[]'), 'run-voicing-tts') }}
          RUN_VOICING_TTS_CUSTOM_VOICE_LABEL: ${{ contains(fromJson(needs.preflight.outputs.labels || '[]'), 'run-voicing-tts-custom-voice') }}
          TTS_CI_MODEL_OVERRIDE: ${{ github.event.inputs.tts_ci_model }}
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The CustomVoice preset is not calibrated on the CI host yet, so it
          # runs by label or dispatch only.
          models=(voicing-tts)
          override="${TTS_CI_MODEL_OVERRIDE,,}"
          if [[ "${RUN_VOICING_TTS_LABEL}" == "true" && "${RUN_VOICING_TTS_CUSTOM_VOICE_LABEL}" == "true" ]]; then
            echo "::error::run-voicing-tts and run-voicing-tts-custom-voice are mutually exclusive"
            exit 1
          fi

          selection_digest=""
          if [[ -n "${override}" ]]; then
            case "${override}" in
              voicing-tts|voicing-tts-custom-voice) ;;
              *)
                echo "::error::unsupported tts_ci_model=${TTS_CI_MODEL_OVERRIDE}; expected voicing-tts or voicing-tts-custom-voice"
                exit 1
                ;;
            esac
            selected_model="${override}"
            selection_reason="workflow_dispatch_override"
          elif [[ "${RUN_VOICING_TTS_LABEL}" == "true" ]]; then
            selected_model="voicing-tts"
            selection_reason="run-voicing-tts_label"
          elif [[ "${RUN_VOICING_TTS_CUSTOM_VOICE_LABEL}" == "true" ]]; then
            selected_model="voicing-tts-custom-voice"
            selection_reason="run-voicing-tts-custom-voice_label"
          else
            selection_digest="$(printf "%s" "${GITHUB_RUN_ID}" | sha256sum | awk '{print $1}')"
            selection_index=$((16#${selection_digest: -1} % ${#models[@]}))
            selected_model="${models[${selection_index}]}"
            selection_reason="stable_github_run_id_digest"
            echo "Selection digest for TTS CI model: ${selection_digest}"
          fi
          echo "Selected TTS CI model: ${selected_model}"

          output_dir="${RUNNER_TEMP}/tts-preflight"
          mkdir -p "${output_dir}"
          export selected_model selection_digest selection_reason
          python - <<'PY' > "${output_dir}/preflight.json.tmp"
          import json
          import os

          print(
              json.dumps(
                  {
                      "schema_version": 1,
                      "exact_sha": os.environ["EXACT_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "workflow_url": (
                          f"{os.environ['GITHUB_SERVER_URL']}/"
                          f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                          f"{os.environ['GITHUB_RUN_ID']}"
                      ),
                      "selected_model": os.environ["selected_model"],
                      "selection_digest": os.environ["selection_digest"],
                      "selection_reason": os.environ["selection_reason"],
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
          mv "${output_dir}/preflight.json.tmp" "${output_dir}/preflight.json"
          echo "selected_model=${selected_model}" >> "${GITHUB_OUTPUT}"
          echo "selection_digest=${selection_digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload TTS preflight
        uses: actions/upload-artifact@v4
        with:
          name: tts-preflight
          path: ${{ runner.temp }}/tts-preflight/preflight.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  tts-ci:
    name: TTS CI
    needs: [setup, pr-test, pick-tts-model]
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      needs.pick-tts-model.result == 'success'
    uses: ./.github/workflows/test-tts-ci.yaml
    with:
      tts_ci_model: ${{ needs.pick-tts-model.outputs.selected_model }}
      omni_ci_home: >-
        ${{ github.event_name == 'pull_request'
            && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
            || format('/data/omni-ci/run-{0}', github.run_id) }}
    secrets: inherit

  pr-test:
    name: PR Test
    needs: setup
    if: >-
      needs.setup.result == 'success'
    uses: ./.github/workflows/test.yaml
    with:
      omni_ci_home: >-
        ${{ github.event_name == 'pull_request'
            && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
            || format('/data/omni-ci/run-{0}', github.run_id) }}
    secrets: inherit

  cleanup:
    name: cleanup - reclaim ephemeral run home
    needs: [setup, pr-test, tts-ci]
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, h100]
    timeout-minutes: 5
    container:
      image: hongccc/sglang-omni@sha256:ebe4239e29a764ee3a2806385c061c5fd438a26f01458e503d3822dcba5790df
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-cleanup-host
        with:
          ci-home: ${{ env.OMNI_CI_HOME }}
