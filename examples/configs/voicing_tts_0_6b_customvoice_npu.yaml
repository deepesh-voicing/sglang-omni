config_cls: VoicingTTSPipelineConfig
# python -m sglang_omni.models.voicing_tts.convert_checkpoint Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice checkpoints/voicing-tts-12hz-0.6b-customvoice
model_path: checkpoints/voicing-tts-12hz-0.6b-customvoice

stages:
  preprocessing:
    factory:
      max_concurrency: 1
  tts_engine:
    gpu: 0
    tp_size: 1
    factory:
      dtype: bfloat16
      attn_implementation: sdpa
    engine:
      attention_backend: ascend
      disable_cuda_graph: true
      disable_overlap_schedule: true
      enable_torch_compile: false
      torch_compile_max_bs: 1
      max_running_requests: 1
      max_queued_requests: 8
      max_prefill_tokens: 4096
      mem_fraction_static: 0.70
      sampling_backend: pytorch
  vocoder:
    gpu: 0
    factory:
      dtype: bfloat16
      attn_implementation: sdpa
      max_batch_size: 1
      initial_max_batch_size: 1
      followup_max_batch_size: 1
